name: Flasher

# Publishes the browser flasher (flasher/, scripts/build_flasher_site.sh) to
# GitHub Pages with the latest release's firmware, after every successful
# production release. Run it manually to republish.
# Release assets can't be fetched cross-site (no CORS), so the firmware is
# copied into the site rather than linked.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Latest production release (pre-releases like dev are skipped)
      - name: Download release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          gh release download "$tag" --pattern '*-full.bin' --dir release
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "Publishing flasher for $tag"

      - run: scripts/build_flasher_site.sh "$VERSION" release site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
