name: Release

# Two channels:
#   master  - production. Merging develop into master builds the artifacts,
#             tags the merge commit v<VERSION> and publishes a GitHub Release.
#   develop - development. Every push replaces the rolling "dev" pre-release
#             with artifacts built from that commit.
# Running it manually builds the artifacts without publishing.
#
# Firmware is built per board (see FIRMWARE_TARGETS). Dev pre-releases only
# carry the classic ESP32 build; production releases and manual runs build all.

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "master" ]; then
            channel=prod
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists - bump VERSION before merging into master"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "develop" ]; then
            channel=dev
            version="$version-dev.$(git rev-parse --short HEAD)"
          else
            channel=none
            version="$version-build.$(git rev-parse --short HEAD)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Building $version ($channel)"

      # env = PlatformIO env and artifact suffix; bootloader offset differs per chip
      - id: targets
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          FIRMWARE_TARGETS: >-
            [
              {"env": "esp32dev", "chip": "esp32", "bootloader": "0x1000", "dev": true},
              {"env": "esp32s3-ws-lcd169", "chip": "esp32s3", "bootloader": "0x0", "dev": false},
              {"env": "esp32s3-ws-lcd128", "chip": "esp32s3", "bootloader": "0x0", "dev": false}
            ]
        run: |
          if [ "$CHANNEL" = "dev" ]; then
            targets=$(jq -c '[.[] | select(.dev)]' <<< "$FIRMWARE_TARGETS")
          else
            targets=$(jq -c '.' <<< "$FIRMWARE_TARGETS")
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Firmware targets: $(jq -r 'map(.env) | join(", ")' <<< "$targets")"

  firmware:
    name: Firmware (${{ matrix.env }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.targets) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag locally so scripts/version.py stamps the plain release version.
      # The tag is pushed by the publish job once everything has built.
      # Dev builds stay untagged and report <VERSION>+g<sha>.
      - name: Tag release commit
        if: needs.version.outputs.channel == 'prod'
        run: git tag "v$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio esptool

      - run: pio run -e "$TARGET"

      - name: Package firmware
        run: |
          build=".pio/build/$TARGET"
          boot_app0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          name="klippyface-firmware-$VERSION-$TARGET"
          mkdir -p dist

          cp "$build/firmware.bin" "dist/$name.bin"

          # Single image for a blank board: esptool write-flash 0x0 <file>
          python -m esptool --chip ${{ matrix.chip }} merge-bin \
            -o "dist/$name-full.bin" \
            ${{ matrix.bootloader }} "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xe000 "$boot_app0" \
            0x10000 "$build/firmware.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/*

  server:
    name: Server (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-arm64, linux-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish server
        run: |
          dotnet publish server -c Release -r ${{ matrix.rid }} --self-contained \
            -o "publish/klippyface-server-$VERSION-${{ matrix.rid }}"

      - name: Package server
        run: |
          mkdir -p dist
          tar -czf "dist/klippyface-server-$VERSION-${{ matrix.rid }}.tar.gz" \
            -C publish "klippyface-server-$VERSION-${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: dist/*

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    if: needs.version.outputs.channel != 'none'
    needs: [version, firmware, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish production release
        if: env.CHANNEL == 'prod'
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

      - name: Publish dev pre-release
        if: env.CHANNEL == 'dev'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build $VERSION" \
            --notes "Rolling build of \`develop\` at $GITHUB_SHA. Replaced on every push to \`develop\` - not for production use."
