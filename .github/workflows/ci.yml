name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32s3-ws-lcd169, esp32s3-ws-lcd128]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          # Per env: the S3 targets pull a different toolchain than the classic ESP32
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - run: pio run -e ${{ matrix.env }}

  server:
    name: Server + Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: server
        run: dotnet build -c Release

      - name: Test
        run: dotnet test --solution klippyface.slnx -c Release

  release-check:
    name: Release check
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION is synced and unreleased
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          ui_version=$(jq -r .version ui/package.json)

          if [ "$version" != "$ui_version" ]; then
            echo "::error::VERSION ($version) does not match ui/package.json ($ui_version)"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists - bump VERSION before releasing"
            exit 1
          fi

          echo "Ready to release v$version"
