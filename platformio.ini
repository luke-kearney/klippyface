[platformio]
default_envs = esp32dev

[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3

debug_build_flags =
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_CLIENT

; Shared by every target. Upload/monitor ports are auto-detected; pass
; --upload-port / --port to pick one.
[esp32_base]
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^7.3.0
    links2004/WebSockets@^2.7.3
    moononournation/GFX Library for Arduino@1.3.5

build_flags = ${common.build_flags}
extra_scripts = pre:scripts/version.py

; ----------------------------------------------------------------------
; Classic ESP32 dev board (4 MB flash, no PSRAM)
; ----------------------------------------------------------------------
[env:esp32dev]
extends = esp32_base
board = esp32dev
board_build.mcu = esp32
board_build.flash_mode = qio
board_build.f_flash = 80000000L

[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags = ${common.build_flags} ${common.debug_build_flags}

[env:esp32dev-mock]
extends = env:esp32dev
build_flags = ${common.build_flags} -DMOONRAKER_MOCK

; ----------------------------------------------------------------------
; ESP32-S3 boards with 16 MB flash. PSRAM type (octal vs quad) and the
; USB serial mode are fixed at build time, so each board gets its own env.
; Board pins and quirks live in src/config/Board.h.
; ----------------------------------------------------------------------
[esp32s3_base]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Waveshare ESP32-S3-Touch-LCD-1.69: S3R8 (8 MB octal PSRAM), ST7789V2
; 240x280, native USB serial (shows up as /dev/ttyACM*)
[env:esp32s3-ws-lcd169]
extends = esp32s3_base
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DKLIPPYFACE_BOARD_WS_LCD169

; Waveshare ESP32-S3-LCD-1.28: S3R2 (2 MB quad PSRAM), GC9A01A 240x240
; round, CH343P USB-UART (shows up as /dev/ttyUSB*)
[env:esp32s3-ws-lcd128]
extends = esp32s3_base
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DKLIPPYFACE_BOARD_WS_LCD128
